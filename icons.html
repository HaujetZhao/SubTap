<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>应景图标候选 — SubTap</title>
  <script type="module">import '@fortawesome/fontawesome-free/css/all.min.css'</script>
  <style>
    body { font-family: system-ui, sans-serif; background: #1e1f21; color: #d7d5d0; margin: 24px; }
    h2 { margin: 28px 0 8px; font-size: 15px; color: #9b9a93; }
    .grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .card {
      width: 120px; padding: 12px 8px; border-radius: 9px; text-align: center;
      background: #252628; border: 1px solid #333438;
    }
    .card i { font-size: 26px; color: #fff; }
    .card .name { margin-top: 8px; font-size: 11px; color: #a5a39d; font-family: Consolas, monospace; }
  </style>
</head>
<body>
  <h2>上一句 / 下一句 候选</h2>
  <div class="grid" id="g1"></div>
  <h2>播放 / 停止 / 重播 候选</h2>
  <div class="grid" id="g2"></div>
  <h2>全屏 / 退出全屏 候选</h2>
  <div class="grid" id="g3"></div>
  <h2>其他可能用得上</h2>
  <div class="grid" id="g4"></div>
  <script>
    const groups = {
      g1: ['fa-angles-up', 'fa-chevron-up', 'fa-arrow-up', 'fa-turn-up', 'fa-caret-up', 'fa-sort-up',
           'fa-angles-down', 'fa-chevron-down', 'fa-arrow-down', 'fa-turn-down', 'fa-caret-down', 'fa-sort-down',
           'fa-backward-step', 'fa-forward-step', 'fa-backward-fast', 'fa-forward-fast'],
      g2: ['fa-play', 'fa-stop', 'fa-pause', 'fa-rotate-right', 'fa-arrows-rotate', 'fa-repeat',
           'fa-circle-play', 'fa-circle-stop', 'fa-circle-pause'],
      g3: ['fa-expand', 'fa-compress', 'fa-up-right-and-down-left-from-center', 'fa-down-left-and-up-right-to-center',
           'fa-maximize', 'fa-minimize'],
      g4: ['fa-hand-pointer', 'fa-ear-listen', 'fa-closed-captioning', 'fa-quote-left', 'fa-heading'],
    };
    for (const [id, names] of Object.entries(groups)) {
      document.getElementById(id).innerHTML = names.map(n =>
        `<div class="card"><i class="fas ${n}"></i><div class="name">${n}</div></div>`).join('');
    }
  </script>
</body>
</html>
