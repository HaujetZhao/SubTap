<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>纯函数测试</title>
<style>
  body { font-family: monospace; padding: 20px; white-space: pre-wrap; }
  .pass { color: #16a34a; }
  .fail { color: #dc2626; font-weight: bold; }
</style>
</head>
<body>
<div id="out"></div>
<script type="module">
import { parseSRT } from './src/logic/srt-parser.js';
import { isWordTimedVtt, resplitWordTimedVtt } from './src/logic/yt-vtt-resplit.js';
import { buildVocab, tokenizeForRender, classifyWords } from './src/logic/word-lookup.js';
import { createVocabStore } from './src/logic/vocab-store.js';
import { computeEffectiveRanges } from './src/logic/subtitle-tweak.js';
import { lemmatize, lemmatizeChain } from './src/logic/lemmatize.js';
import { extractMkvSubtitles, isMkv } from './src/logic/mkv-subtitles.js';

const out = document.getElementById('out');
let pass = 0, fail = 0;
function check(name, cond) {
  if (cond) { pass++; out.innerHTML += '<span class="pass">✓ ' + name + '</span>\n'; }
  else { fail++; out.innerHTML += '<span class="fail">✗ ' + name + '</span>\n'; }
}

// --- parseSRT ---
const sample = '1\n00:00:00,080 --> 00:00:01,480\nWhen you encode text into binary\n\n'
  + '2\n00:00:02,080 --> 00:00:04,200\nit\'s often nice\nto use as little data as possible\n\n'
  + '3\n00:00:04,720 --> 00:00:10,600\nSo you might naturally wonder\n';
const s = parseSRT(sample);
check('解析出 3 句', s.length === 3);
check('第1句 start=0.08', s[0].start === 0.08);
check('第1句 id=1', s[0].id === 1);
check('第1句文本正确', s[0].text === 'When you encode text into binary');
check('第2句多行文本合并', s[1].text === "it's often nice\nto use as little data as possible");
check('容错：坏块跳过', parseSRT('1\n00:00:00,080 --> 00:00:01,480\nhello\n\n坏块\n\n2\n00:00:02,000 --> 00:00:03,000\nworld\n').length === 2);

// --- YouTube 字级时间戳 VTT 重分句 ---
const ytVtt = 'WEBVTT\nKind: captions\nLanguage: en\n\n'
  + '00:00:00.080 --> 00:00:02.310 align:start position:0%\n \n'
  + 'There\'s<00:00:00.320><c> a</c><00:00:00.560><c> wild</c><00:00:01.040><c> paper.</c>\n\n'
  + '00:00:02.310 --> 00:00:02.320 align:start position:0%\nThere\'s a wild paper.\n \n\n'
  + '00:00:02.320 --> 00:00:04.550 align:start position:0%\nThere\'s a wild paper.\n'
  + 'called<00:00:02.800><c> language</c><00:00:03.280><c> trees.</c>\n\n';
check('ytVtt: 识别字级时间戳 VTT', isWordTimedVtt(ytVtt));
check('ytVtt: 普通 VTT 不识别', !isWordTimedVtt('WEBVTT\n\n00:00:00.080 --> 00:00:02.310\nhello world\n'));
check('ytVtt: 普通 SRT 不识别', !isWordTimedVtt(sample));
const ys = resplitWordTimedVtt(ytVtt);
check('ytVtt: 分成 2 句', ys.length === 2);
check('ytVtt: 第1句文本', ys[0].text === "There's a wild paper.");
check('ytVtt: 第1句起点=首词时间戳', ys[0].start === 0.08);
check('ytVtt: 第2句含滚动新增词', ys[1].text === 'called language trees.');
check('ytVtt: 第2句起点=called 行首裸词用 cue start', ys[1].start === 2.32);
check('ytVtt: 第2句末句时长兜底', ys[1].end > ys[1].start);
check('ytVtt: parseSRT 自动走重分句', (() => { const r = parseSRT(ytVtt); return r.length === 2 && r[1].text === 'called language trees.'; })());
// 无标签新词(document. 只出现在纯文本行)不丢
const ytVtt2 = 'WEBVTT\n\n'
  + '00:00:00.000 --> 00:00:01.000\nidentifying<00:00:00.200><c> who</c><00:00:00.500><c> authored</c><00:00:00.800><c> a</c>\n\n'
  + '00:00:01.000 --> 00:00:01.010\nidentifying who authored a\n \n\n'
  + '00:00:01.010 --> 00:00:02.000\nidentifying who authored a\ndocument.\n\n';
const ys2 = resplitWordTimedVtt(ytVtt2);
check('ytVtt: 无标签新词不丢', ys2.length === 1 && ys2[0].text === 'identifying who authored a document.');

const vo = { '初中': { 'encode': 'v. 编码', 'text': 'n. 文本' }, '四级': { 'compress': 'v. 压缩', 'binary': 'n. 二进制' } };
const v = buildVocab(vo);
check('buildVocab: encode 命中 初中', v['encode'].level === '初中' && v['encode'].def === 'v. 编码');
check('buildVocab: compress 命中 四级', v['compress'].level === '四级');
check('classify: 大小写归一', classifyWords('When you ENCODE text into binary!', v)['初中'].map(w => w.word).join() === 'encode,text');
check('classify: 去重', classifyWords('ENCODE encode text!', v)['初中'].length === 2);
check('classify: 未命中归超纲不返回', classifyWords('hello world', v)['初中'] === undefined);

// --- VocabStore ---
const store = createVocabStore();
store.init(vo);
check('VocabStore: levels 顺序(含超纲)', JSON.stringify(store.getLevels()) === '["初中","四级","超纲"]');
check('VocabStore: 四级默认不勾选', store.isEnabled('四级') === false);
// 为查询测试启用 初中/四级（默认是关闭的）
store.setEnabled('初中', true);
store.setEnabled('四级', true);
const g1 = store.lookupByLevel('When you ENCODE text into binary compress');
check('lookupByLevel: 初中 2 词', g1['初中'] && g1['初中'].length === 2);
check('lookupByLevel: 四级 2 词', g1['四级'] && g1['四级'].length === 2);
check('lookupByLevel: 初中首词 encode', g1['初中'][0].word === 'encode');
store.setEnabled('四级', false);
check('VocabStore: 取消后 false', store.isEnabled('四级') === false);
const g2 = store.lookupByLevel('When you ENCODE text into binary compress');
check('lookupByLevel: 取消后无四级栏', g2['四级'] === undefined && g2['初中'].length === 2);
const gh = store.lookupByLevel('hello world');
check('lookupByLevel: 全超纲词归超纲组', !!gh['超纲'] && gh['超纲'].length === 2);
// 超纲分级
const sg = store.lookupByLevel('encode compress zzz'); // encode→初中, compress→四级(已关), zzz→超纲
check('VocabStore: 超纲组存在', !!sg['超纲'] && sg['超纲'].length === 1);
store.setEnabled('超纲', false);
check('VocabStore: 取消超纲后无超纲栏', store.lookupByLevel('encode zzz')['超纲'] === undefined);
store.setEnabled('超纲', true);
// 默认勾选状态
const s2 = createVocabStore();
s2.init(vo);
check('VocabStore: 初中默认不勾选', s2.isEnabled('初中') === false);
check('VocabStore: 超纲默认勾选', s2.isEnabled('超纲') === true);

  // --- subtitle-tweak ---
  const ss = [{ id: 1, start: 0, end: 1 }, { id: 2, start: 2, end: 3 }, { id: 3, start: 5, end: 6 }];
  const m0 = computeEffectiveRanges(ss, {});
  check('tweak: 默认 effStart=start/effEnd=end', m0.get(1).effStart === 0 && m0.get(1).effEnd === 1);
  const mo = computeEffectiveRanges(ss, { offset: 1 });
  check('tweak: offset 影响 start', mo.get(1).effStart === 1);
  const me = computeEffectiveRanges(ss, { extend: 0.5 });
  check('tweak: extend 影响 end', me.get(1).effEnd === 1.5);
  const ml = computeEffectiveRanges(ss, { linkNext: true });
  check('tweak: linkNext 连下一句 start', ml.get(1).effEnd === 2);
  check('tweak: linkNext 末句用 end', ml.get(3).effEnd === 6);
  const ml2 = computeEffectiveRanges(ss, { linkNext: true, extend: 0.5 });
  check('tweak: linkNext 末句 end+extend', ml2.get(3).effEnd === 6.5);
  const mlo = computeEffectiveRanges(ss, { linkNext: true, linkNextOffset: -0.3 });
  check('tweak: linkNextOffset -0.3 提前结束', mlo.get(1).effEnd === 1.7);
  const mlo2 = computeEffectiveRanges(ss, { linkNext: true, linkNextOffset: 0.5 });
  check('tweak: linkNextOffset +0.5 延后', mlo2.get(1).effEnd === 2.5);
  const mlo3 = computeEffectiveRanges(ss, { linkNext: true, offset: 1, linkNextOffset: -0.3 });
  check('tweak: offset+linkNextOffset 叠加', mlo3.get(1).effEnd === 2.7);
  const mc = computeEffectiveRanges([{ id: 1, start: 5, end: 6 }], { offset: 10 });
  check('tweak: effEnd<=effStart 夹到 +0.05', mc.get(1).effStart === 15 && mc.get(1).effEnd === 15.05);

  // --- tokenizeForRender / classifyWords ---
  const tv = { 'hello': { level: '初中', def: 'x' } };
  const toks = tokenizeForRender('Hello, world!', tv);
  check('tokenize: 片段数=4', toks.length === 4);
  check('tokenize: 词片段带级别', toks[0].text === 'Hello' && toks[0].level === '初中');
  check('tokenize: 非词片段 level=null', toks[1].text === ', ' && toks[1].level === null);
  check('tokenize: 未命中词=超纲', toks[2].text === 'world' && toks[2].level === '超纲');
  check('tokenize: 末尾标点', toks[3].text === '!' && toks[3].level === null);

  const grps = classifyWords('Hello hello world', tv);
  check('classify: 初中去重=1', grps['初中'] && grps['初中'].length === 1);
  check('classify: 超纲=1', grps['超纲'] && grps['超纲'].length === 1);
  check('classify: 超纲 def 空', grps['超纲'][0].def === '');

  // --- lemmatize ---
  check('lem: raises→含 raise', lemmatize('raises').includes('raise'));
  check('lem: running→含 run', lemmatize('running').includes('run'));
  check('lem: studies→含 study', lemmatize('studies').includes('study'));
  check('lem: went→含 go', lemmatize('went').includes('go'));
  check('lem: happily→含 happy', lemmatize('happily').includes('happy'));
  check('lem: logarithmic→含 logarithm', lemmatize('logarithmic').includes('logarithm'));
  // 精简 IRREGULAR_VERBS 后靠后缀规则还原的三单/ing/规则过去式
  check('lem: goes→go（规则 es）', lemmatize('goes').includes('go'));
  check('lem: flies→fly（规则 ies）', lemmatize('flies').includes('fly'));
  check('lem: catches→catch（规则 es）', lemmatize('catches').includes('catch'));
  check('lem: buying→buy（规则 ying）', lemmatize('buying').includes('buy'));
  check('lem: showed→show（规则 ed）', lemmatize('showed').includes('show'));
  check('lem: caught→catch（不规则表）', lemmatize('caught').includes('catch'));
  check('lem: taken→take（不规则表）', lemmatize('taken').includes('take'));
  // 缩约形式还原
  check("lem: don't→do", lemmatize("don't").includes('do'));
  check("lem: can't→can", lemmatize("can't").includes('can'));
  check("lem: it's→it", lemmatize("it's").includes('it'));
  check("lem: let's→let", lemmatize("let's").includes('let'));
  // 撇号所有格：取撇号前 base 再还原（letters' → letters → letter）
  check("lem: letters'→letter", lemmatize("letters'").includes('letter'));
  // 单字母不处理
  check('lem: 单字母 s→空', lemmatize('s').length === 0);
  // 新增多级派生规则
  check('lem: paradoxical→paradox', lemmatize('paradoxical').includes('paradox'));
  check('lem: biologist→biology', lemmatize('biologist').includes('biology'));
  check('lem: classification→classify', lemmatize('classification').includes('classify'));
  check('lem: readability→readable', lemmatize('readability').includes('readable'));
  // 链式还原：宽度优先，第一层（dangerous）先于第二层（danger）
  check('chain: dangerously→含 danger', lemmatizeChain('dangerously').includes('danger'));
  check('chain: dangerous 层次先于 danger',
    lemmatizeChain('dangerously').indexOf('dangerous') < lemmatizeChain('dangerously').indexOf('danger'));
  check('chain: hopelessly→含 hope', lemmatizeChain('hopelessly').includes('hope'));
  // 链第 2 层后缀门槛：裸去短后缀（-er/-y/-s）不参与，挡同形异源误配
  check('chain: ridability→ride（able 补 e）', lemmatizeChain('ridability').includes('ride'));
  check('chain: adulterously 不含 adult', !lemmatizeChain('adulterously').includes('adult'));
  // 跨后缀映射
  check('lem: abjuration→abjure', lemmatize('abjuration').includes('abjure'));
  check('lem: alcoholism→alcohol', lemmatize('alcoholism').includes('alcohol'));
  check('lem: abductor→abduction', lemmatize('abductor').includes('abduction'));
  check('chain: abbreviatory→abbreviation', lemmatizeChain('abbreviatory').includes('abbreviation'));
  check('chain: abandonedly→abandon', lemmatizeChain('abandonedly').includes('abandon'));
  // 比较级 / 最高级 / 副词
  check('lem: easier→easy', lemmatize('easier').includes('easy'));
  check('lem: easiest→easy', lemmatize('easiest').includes('easy'));
  check('lem: inexorably→inexorable', lemmatize('inexorably').includes('inexorable'));
  check('lem: heard→hear（不规则）', lemmatize('heard').includes('hear'));
  // 名词/形容词/副词派生后缀还原
  check('lem: mathematically→mathematic', lemmatize('mathematically').includes('mathematic'));
  check('lem: classically→classical', lemmatize('classically').includes('classical'));
  check('lem: historically→history', lemmatize('historically').includes('history'));
  check('lem: electrical→electric（-ical→ic）', lemmatize('electrical').includes('electric'));
  check('lem: logical→logic（-ical→ic）', lemmatize('logical').includes('logic'));
  check('lem: historic→history（-ical→y）', lemmatize('historic').includes('history'));
  check('lem: economic→economy（-ic→y）', lemmatize('economic').includes('economy'));
  check('lem: compatibility→compatible（-ility→le）', lemmatize('compatibility').includes('compatible'));
  check('lem: responsibility→responsible（-ility→le）', lemmatize('responsibility').includes('responsible'));
  check('lem: fragility→fragile（-ility→e）', lemmatize('fragility').includes('fragile'));
  check('lem: activity→active（-ity→e）', lemmatize('activity').includes('active'));
  check('lem: reality→real（-ity→空）', lemmatize('reality').includes('real'));
  check('lem: humanity→human（-ity→空）', lemmatize('humanity').includes('human'));
  check('lem: kindness→kind（-ness→空）', lemmatize('kindness').includes('kind'));
  check('lem: happiness→happy（-iness→y）', lemmatize('happiness').includes('happy'));
  check('lem: helpful→help（-ful）', lemmatize('helpful').includes('help'));
  check('lem: careless→care（-less）', lemmatize('careless').includes('care'));
  check('lem: dangerous→danger（-ous）', lemmatize('dangerous').includes('danger'));
  check('lem: continuous→continue（-ous→e）', lemmatize('continuous').includes('continue'));
  check('lem: famous→fame（-ous→e）', lemmatize('famous').includes('fame'));
  check('lem: active→act（-ive）', lemmatize('active').includes('act'));
  check('lem: creative→create（-ive→e）', lemmatize('creative').includes('create'));
  check('lem: leaves→leaf（-ves→f）', lemmatize('leaves').includes('leaf'));
  check('lem: knives→knife（-ves→fe）', lemmatize('knives').includes('knife'));
  check('lem: lives→life（-ves→fe）', lemmatize('lives').includes('life'));
  check('lem: bases→basis（-ses→sis）', lemmatize('bases').includes('basis'));
  check('lem: analyses→analysis（-ses→sis）', lemmatize('analyses').includes('analysis'));
  check('lem: friendship→friend（-ship）', lemmatize('friendship').includes('friend'));
  check('lem: relationship→relation（-ship）', lemmatize('relationship').includes('relation'));
  // 候选排序：去双写候选优先于同后缀直接去后缀的长候选
  check('lem: putting 的 put 排在 putt 前', lemmatize('putting').indexOf('put') < lemmatize('putting').indexOf('putt'));
  check('lem: planning 的 plan 排在 plann 前', lemmatize('planning').includes('plan') && lemmatize('planning').indexOf('plan') === 0);
  check('lem: stopping 的 stop 排在 stopp 前', lemmatize('stopping').indexOf('stop') === 0);
  check('lem: coding 不产伪双写候选 co', !lemmatize('coding').includes('co'));
  check('lem: doing 不产补 e 候选 doe、do 在候选里', !lemmatize('doing').includes('doe') && lemmatize('doing').includes('do'));
  check('lem: being 不产补 e 候选 bee、be 在候选里', !lemmatize('being').includes('bee') && lemmatize('being').includes('be'));
  check('lem: discussed 不产伪双写候选 discus', !lemmatize('discussed').includes('discus') && lemmatize('discussed').includes('discuss'));
  check('lem: coding 的 code 仍在 cod 前（长度降序不回退）', lemmatize('coding').indexOf('code') < lemmatize('coding').indexOf('cod'));
  check('lem: owing 的 owe 仍在（w 不算元音）', lemmatize('owing').includes('owe'));

  // --- 词形还原查词（端到端） ---
  const lvo = { '初中': { raise: 'v. 举起', run: 'v. 跑', study: 'v. 学习', letter: 'n. 字母' } };
  const lv = buildVocab(lvo);
  check('classify: raises 还原命中 raise', classifyWords('He raises his hand', lv)['初中'][0].word === 'raise');
  check('classify: raises→raise 显示原形', classifyWords('raises', lv)['初中'][0].word === 'raise');
  check('classify: raises+raising 合并一条', classifyWords('raises raising raised', lv)['初中'].length === 1);
  check('classify: 超纲词还原失败仍超纲', !!classifyWords('zzzz', lv)['超纲']);
  // 缩约/所有格/单字母在查词链路的行为
  check("classify: don't→do 命中（库含 do）", classifyWords("don't", buildVocab({ '初中': { do: 'v. 做' } }))['初中'][0].word === 'do');
  check("classify: letters'→letter 命中", classifyWords("letters'", lv)['初中'][0].word === 'letter');
  check('classify: 单字母不进超纲', classifyWords('a s b', lv)['超纲'] === undefined);
  check('tokenize: 单字母不着色（level=null）', tokenizeForRender('a x', lv)[0].level === null);
  // 双层还原：encodings → encoding → encode
  check('classify: encodings→encode（双层）', classifyWords('encodings', buildVocab({ '初中': { encode: 'v. 编码' } }))['初中'][0].word === 'encode');

  // --- MKV 内封字幕提取 ---
  // 夹具：现场合成最小 EBML 字节流（vint 编码 + element 拼接），不依赖外部文件
  const vintEnc = (v) => {  // size/数值用 vint：首字节置标记位
    let n = 1; while (v >= (1 << (7 * n))) n++;
    const a = new Uint8Array(n); let x = v;
    for (let i = n - 1; i >= 0; i--) { a[i] = x & 0x7f; x >>>= 7; }
    a[0] |= 1 << (8 - n);
    return a;
  };
  const uintBytes = (v) => { const a = []; do { a.unshift(v & 0xff); v = Math.floor(v / 256); } while (v); return Uint8Array.from(a); };
  const str = (s) => new TextEncoder().encode(s);
  const cat = (parts) => {  // 拼接多段 Uint8Array
    let n = 0; for (const p of parts) n += p.length;
    const o = new Uint8Array(n); let k = 0;
    for (const p of parts) { o.set(p, k); k += p.length; }
    return o;
  };
  const el = (idBytes, payload) => cat([idBytes, vintEnc(payload.length), payload]);  // element = id + size vint + 载荷
  const ID = {
    EBML: Uint8Array.of(0x1A, 0x45, 0xDF, 0xA3), SEG: Uint8Array.of(0x18, 0x53, 0x80, 0x67),
    INFO: Uint8Array.of(0x15, 0x49, 0xA9, 0x66), TCS: Uint8Array.of(0x2A, 0xD7, 0xB1),
    TRACKS: Uint8Array.of(0x16, 0x54, 0xAE, 0x6B), TRACKENTRY: Uint8Array.of(0xAE),
    TN: Uint8Array.of(0xD7), TT: Uint8Array.of(0x83), CID: Uint8Array.of(0x86), LANG: Uint8Array.of(0x22, 0xB5, 0x9C),
    CLUSTER: Uint8Array.of(0x1F, 0x43, 0xB6, 0x75), TC: Uint8Array.of(0xE7), CENC: Uint8Array.of(0x6D, 0x80),
    SIMPLE: Uint8Array.of(0xA3), BG: Uint8Array.of(0xA0), BLOCK: Uint8Array.of(0xA1), DUR: Uint8Array.of(0x9B),
    DOCTYPE: Uint8Array.of(0x42, 0x82),
  };
  // 拼一个最小 MKV：EBML头 + Segment(Info? + Tracks + Clusters(Timecode + blocks))
  // tracks: [{no, codec, type=0x11, lang, compressed}]；blocks: [{relMs, durMs?, text|payload}]
  // （durMs 有值走 BlockGroup，否则 SimpleBlock；payload 直接给字节，text 用 str 编码）
  // clusters: [{clusterMs, blocks}] 多 Cluster；单 Cluster 用顶层 clusterMs/blocks 简写
  // unknownClusterSize: Cluster size 写保留值（vint 全 1），解析器应下钻扫子元素
  const mkMkv = ({ docType = null, timecodeScale = null, tracks, clusters = null, clusterMs = 0, blocks = [], unknownClusterSize = false }) => {
    const header = el(ID.EBML, docType != null ? el(ID.DOCTYPE, str(docType)) : new Uint8Array());
    const info = el(ID.INFO, timecodeScale != null ? el(ID.TCS, uintBytes(timecodeScale)) : new Uint8Array());
    const trackEntries = tracks.map(t => el(ID.TRACKENTRY, cat([
      el(ID.TN, uintBytes(t.no)), el(ID.TT, uintBytes(t.type ?? 0x11)), el(ID.CID, str(t.codec)),
      ...(t.lang ? [el(ID.LANG, str(t.lang))] : []),
      ...(t.compressed ? [el(ID.CENC, new Uint8Array())] : []),  // 空 ContentEncodings master 即标记压缩
    ])));
    const mkBlock = (b) => cat([  // vint(trackNo) + int16 相对毫秒 + flags(0) + 载荷
      vintEnc(b.tno ?? tracks[0].no),
      Uint8Array.of((b.relMs >> 8) & 0xff, b.relMs & 0xff, 0),
      b.payload ?? str(b.text),
    ]);
    const mkCluster = ({ clusterMs, blocks }) => {
      const body = cat([el(ID.TC, uintBytes(clusterMs)), ...blocks.map(b => b.durMs != null
        ? el(ID.BG, cat([el(ID.BLOCK, mkBlock(b)), el(ID.DUR, uintBytes(b.durMs))]))
        : el(ID.SIMPLE, mkBlock(b)))]);
      return unknownClusterSize
        ? cat([ID.CLUSTER, Uint8Array.of(0x01, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF), body])  // size vint 全 1
        : el(ID.CLUSTER, body);
    };
    const clusterEls = (clusters ?? [{ clusterMs, blocks }]).map(mkCluster);
    return cat([header, el(ID.SEG, cat([info, el(ID.TRACKS, cat(trackEntries)), ...clusterEls]))]);
  };
  const near = (a, b) => Math.abs(a - b) < 1e-9;

  // isMkv：头 4 字节 magic number
  check('mkv: isMkv 头 1A 45 DF A3 → true', isMkv(mkMkv({ tracks: [{ no: 1, codec: 'S_TEXT/UTF8' }], blocks: [{ relMs: 0, text: 'x' }] })));
  check('mkv: isMkv 其它头 → false', !isMkv(Uint8Array.of(0x1A, 0x45, 0xDF, 0xA4)) && !isMkv(new Uint8Array(8)));
  // WebM：魔数相同但 DocType=webm，isMkv 排除（避免载入 .webm 弹"无字幕"误报）
  check('mkv: isMkv 排除 WebM（DocType）', !isMkv(mkMkv({ docType: 'webm', tracks: [{ no: 1, codec: 'S_TEXT/UTF8' }], blocks: [{ relMs: 0, text: 'x' }] })));
  check('mkv: isMkv 显式 DocType=matroska 通过', isMkv(mkMkv({ docType: 'matroska', tracks: [{ no: 1, codec: 'S_TEXT/UTF8' }], blocks: [{ relMs: 0, text: 'x' }] })));

  // S_TEXT/UTF8 + BlockGroup(Block+BlockDuration)：start/end/text 正确
  {
    const r = await extractMkvSubtitles(mkMkv({
      tracks: [{ no: 1, codec: 'S_TEXT/UTF8', lang: 'eng' }],
      blocks: [{ relMs: 80, durMs: 2320, text: 'hello world' }, { relMs: 3000, durMs: 1000, text: 'second' }],
    }));
    const cues = r.cuesByTrack.get(1);
    check('mkv: BlockGroup 轨道元数据', r.tracks.length === 1 && r.tracks[0].codec === 'S_TEXT/UTF8' && r.tracks[0].lang === 'eng');
    check('mkv: BlockGroup 首条 start/end/text', cues.length === 2 && near(cues[0].start, 0.08) && near(cues[0].end, 2.4) && cues[0].text === 'hello world');
    check('mkv: BlockGroup 次条', near(cues[1].start, 3) && near(cues[1].end, 4));
  }
  // SimpleBlock（无时长）：end = min(下一条 start, start+5)
  {
    const r = await extractMkvSubtitles(mkMkv({
      tracks: [{ no: 1, codec: 'S_TEXT/UTF8' }],
      blocks: [{ relMs: 80, text: 'first' }, { relMs: 1500, text: 'last' }],
    }));
    const cues = r.cuesByTrack.get(1);
    check('mkv: SimpleBlock 首条 end=下一条 start', near(cues[0].start, 0.08) && near(cues[0].end, 1.5));
    check('mkv: SimpleBlock 末条 end=start+5', near(cues[1].end, cues[1].start + 5));
  }
  // TimecodeScale=500000：时间减半
  {
    const r = await extractMkvSubtitles(mkMkv({
      timecodeScale: 500000,
      tracks: [{ no: 1, codec: 'S_TEXT/UTF8' }],
      blocks: [{ relMs: 160, durMs: 2000, text: 'x' }],
    }));
    const c = r.cuesByTrack.get(1)[0];
    check('mkv: TimecodeScale=500000 时间减半', near(c.start, 0.08) && near(c.end, 1.08));
  }
  // ASS 轨：逗号保留（slice(8).join(',')），\N 换行替换为空格
  {
    const r = await extractMkvSubtitles(mkMkv({
      tracks: [{ no: 1, codec: 'S_TEXT/ASS' }],
      blocks: [{ relMs: 0, durMs: 1000, text: '5,0,Default,,0,0,0,,hello, world' }],
    }));
    check('mkv: ASS 逗号保留', r.cuesByTrack.get(1)[0].text === 'hello, world');
    const r2 = await extractMkvSubtitles(mkMkv({
      tracks: [{ no: 1, codec: 'S_TEXT/ASS' }],
      blocks: [{ relMs: 0, durMs: 1000, text: '5,0,Default,,0,0,0,,line1\\Nline2' }],
    }));
    check('mkv: ASS \\N 换行替换为空格', r2.cuesByTrack.get(1)[0].text === 'line1 line2');
    // WEBVTT 轨（S_TEXT/WEBVTT）：载荷即 cue 原文，不走 ASS 逗号切分
    const r3 = await extractMkvSubtitles(mkMkv({
      tracks: [{ no: 1, codec: 'S_TEXT/WEBVTT' }],
      blocks: [{ relMs: 0, durMs: 1000, text: 'Hello, world again' }],
    }));
    check('mkv: WEBVTT 载荷按原文', r3.cuesByTrack.get(1)[0].text === 'Hello, world again');
  }
  // 位图轨（S_HDMV/PGS）与无字幕轨：返回空
  {
    const r = await extractMkvSubtitles(mkMkv({ tracks: [{ no: 1, codec: 'S_HDMV/PGS' }], blocks: [{ relMs: 0, text: 'x' }] }));
    check('mkv: 位图轨不进 tracks', r.tracks.length === 0 && r.cuesByTrack.size === 0);
    const r2 = await extractMkvSubtitles(mkMkv({ tracks: [{ no: 1, codec: 'A_VORBIS', type: 0x02 }] }));
    check('mkv: 无字幕轨返回空', r2.tracks.length === 0 && r2.cuesByTrack.size === 0);
  }
  // ContentCompression：ContentEncodings 空 master 标记 + 载荷 zlib 压缩（CompressionStream('deflate')）
  {
    const zlib = await new Response(
      new Blob([str('compressed hello')]).stream().pipeThrough(new CompressionStream('deflate'))
    ).arrayBuffer();
    const r = await extractMkvSubtitles(mkMkv({
      tracks: [{ no: 1, codec: 'S_TEXT/UTF8', compressed: true }],
      blocks: [{ relMs: 100, durMs: 900, payload: new Uint8Array(zlib) }],
    }));
    const c = r.cuesByTrack.get(1)[0];
    check('mkv: ContentCompression tracks 标记 compressed', r.tracks[0].compressed === true);
    check('mkv: ContentCompression 解压取回文本', c.text === 'compressed hello' && near(c.start, 0.1));
  }
  // 未知 size Cluster（size vint 全 1 保留值）：解析器下钻扫子元素，字幕仍提出
  {
    const r = await extractMkvSubtitles(mkMkv({
      tracks: [{ no: 1, codec: 'S_TEXT/UTF8' }],
      clusterMs: 1200,
      unknownClusterSize: true,
      blocks: [{ relMs: 80, durMs: 500, text: 'unk' }],
    }));
    const c = r.cuesByTrack.get(1)[0];
    check('mkv: 未知 size Cluster 仍提出字幕', c.text === 'unk' && near(c.start, 1.28));
  }
  // 非零 Cluster Timecode + 多 Cluster：cue 时间 = cluster 时间 + 块相对时间
  {
    const r = await extractMkvSubtitles(mkMkv({
      tracks: [{ no: 1, codec: 'S_TEXT/UTF8' }],
      clusters: [
        { clusterMs: 10000, blocks: [{ relMs: 200, durMs: 800, text: 'a' }] },
        { clusterMs: 60000, blocks: [{ relMs: 500, durMs: 800, text: 'b' }] },
      ],
    }));
    const cues = r.cuesByTrack.get(1);
    check('mkv: 非零 Cluster Timecode 两 Cluster 时间正确', cues.length === 2 && near(cues[0].start, 10.2) && near(cues[1].start, 60.5));
  }

out.innerHTML += '\n----\n通过 ' + pass + '，失败 ' + fail + '\n';
</script>
</body>
</html>
